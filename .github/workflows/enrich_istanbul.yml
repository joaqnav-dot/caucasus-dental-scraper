name: Enrich Istanbul Leads

on:
  workflow_dispatch:
    inputs:
      europe_run_id:
        description: 'Run ID del scraper Europa (istanbul_europe.txt)'
        required: true
      asia_run_id:
        description: 'Run ID del scraper Asia (istanbul_asia.txt)'
        required: true

permissions:
  actions: read
  contents: read

jobs:

  # ── Batch Europa ─────────────────────────────────────────────────────────────
  enrich_europe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Download Europa scraper output
        run: |
          gh run download ${{ github.event.inputs.europe_run_id }} \
            --repo ${{ github.repository }} \
            --dir ./downloaded_europe
          find ./downloaded_europe -name "*.csv" | head -1 | xargs -I{} cp {} ./input.csv
          echo "Europa rows: $(wc -l < input.csv)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - run: pip install requests beautifulsoup4 duckduckgo-search

      - name: Run enrichment Europa
        env:
          INPUT_FILE: input.csv
          OUTPUT_FILE: enriched_europe.csv
        run: python enrich.py

      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-enriched-europe-run${{ github.run_number }}
          path: enriched_europe.csv
          retention-days: 30

  # ── Batch Asia ───────────────────────────────────────────────────────────────
  enrich_asia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Download Asia scraper output
        run: |
          gh run download ${{ github.event.inputs.asia_run_id }} \
            --repo ${{ github.repository }} \
            --dir ./downloaded_asia
          find ./downloaded_asia -name "*.csv" | head -1 | xargs -I{} cp {} ./input.csv
          echo "Asia rows: $(wc -l < input.csv)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - run: pip install requests beautifulsoup4 duckduckgo-search

      - name: Run enrichment Asia
        env:
          INPUT_FILE: input.csv
          OUTPUT_FILE: enriched_asia.csv
        run: python enrich.py

      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-enriched-asia-run${{ github.run_number }}
          path: enriched_asia.csv
          retention-days: 30

  # ── Merge final ──────────────────────────────────────────────────────────────
  merge:
    runs-on: ubuntu-latest
    needs: [enrich_europe, enrich_asia]
    steps:
      - uses: actions/checkout@v4

      - name: Download enriched batches
        run: |
          gh run download ${{ github.run_id }} \
            --repo ${{ github.repository }} \
            --pattern "istanbul-enriched-*" \
            --dir ./batches
          ls -lh batches/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge + dedup + stats
        run: |
          python3 - <<'EOF'
          import csv, glob

          files = glob.glob('batches/*/enriched_*.csv')
          print('Merging:', files)

          all_rows = []; fieldnames = None
          for f in sorted(files):
              with open(f, encoding='utf-8') as fp:
                  reader = csv.DictReader(fp)
                  if not fieldnames: fieldnames = reader.fieldnames
                  all_rows.extend(list(reader))

          seen = set(); unique = []
          for r in all_rows:
              pid = r.get('place_id') or r.get('cid') or r.get('title','')
              if pid not in seen:
                  seen.add(pid); unique.append(r)

          with open('istanbul_dental_leads.csv','w',newline='',encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fieldnames)
              w.writeheader(); w.writerows(unique)

          total = len(unique)
          print(f'\n=== ISTANBUL FINAL RESULTS ===')
          print(f'Total unique clinics: {total}')
          print(f'Phone:     {sum(1 for r in unique if r.get("phone","").strip())}')
          print(f'Email:     {sum(1 for r in unique if r.get("emails","").strip())}')
          print(f'WhatsApp:  {sum(1 for r in unique if r.get("whatsapp","").strip())}')
          print(f'Instagram: {sum(1 for r in unique if r.get("instagram","").strip())}')
          print(f'Facebook:  {sum(1 for r in unique if r.get("facebook","").strip())}')
          print(f'Website:   {sum(1 for r in unique if r.get("website","").strip())}')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-dental-leads-FINAL-run${{ github.run_number }}
          path: istanbul_dental_leads.csv
          retention-days: 60
