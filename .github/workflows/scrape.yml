name: Dental Clinic Scraper

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: 'Queries file (e.g. ankara.txt, izmir.txt)'
        required: true
        default: 'queries.txt'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Strip comments
        run: |
          grep -v '^\s*#' ${{ github.event.inputs.queries_file }} | grep -v '^\s*$' > queries_clean.txt
          cat queries_clean.txt

      - name: Pull image
        run: docker pull gosom/google-maps-scraper

      - name: Run scraper
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            gosom/google-maps-scraper \
            -input   "/data/queries_clean.txt" \
            -results "/data/output_raw.csv" \
            -lang en \
            -c 6

      - name: Dedup
        run: |
          python3 - <<'EOF'
          import csv
          with open('output_raw.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          seen = set(); unique = []
          for r in rows:
              pid = r.get('place_id') or r.get('cid') or r.get('title')
              if pid not in seen:
                  seen.add(pid); unique.append(r)
          if unique:
              with open('output.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=unique[0].keys())
                  w.writeheader(); w.writerows(unique)
          print(f"Raw: {len(rows)} | Unique: {len(unique)}")
          EOF

      - name: Stats
        run: |
          python3 -c "
          import csv
          rows = list(csv.DictReader(open('output.csv')))
          print(f'Clinics: {len(rows)}')
          print(f'Phone:   {sum(1 for r in rows if r.get(\"phone\",\"\").strip())}')
          print(f'Website: {sum(1 for r in rows if r.get(\"website\",\"\").strip())}')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.event.inputs.queries_file }}-run${{ github.run_number }}
          path: output.csv
          retention-days: 30
