name: Caucasus Dental Scraper

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: 'Queries file to use'
        required: true
        default: 'queries.txt'
        type: choice
        options:
          - queries.txt
          - georgia.txt
          - istanbul.txt

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Strip comments from queries file
        run: |
          grep -v '^\s*#' ${{ github.event.inputs.queries_file }} | grep -v '^\s*$' > queries_clean.txt
          echo "Queries to run:"
          cat queries_clean.txt

      - name: Pull scraper image
        run: docker pull gosom/google-maps-scraper

      - name: Run scraper
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            gosom/google-maps-scraper \
            -input   "/data/queries_clean.txt" \
            -results "/data/output_raw.csv" \
            -lang en \
            -email \
            -c 4

      - name: Deduplicate by place_id
        run: |
          python3 - <<'EOF'
          import csv

          with open('output_raw.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          seen = set()
          unique = []
          for r in rows:
              pid = r.get('place_id') or r.get('cid') or r.get('title')
              if pid not in seen:
                  seen.add(pid)
                  unique.append(r)

          if unique:
              with open('output.csv', 'w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=unique[0].keys())
                  writer.writeheader()
                  writer.writerows(unique)

          print(f"Raw: {len(rows)} | After dedup: {len(unique)} | Removed: {len(rows)-len(unique)}")
          EOF

      - name: Summary
        run: |
          echo "=== FINAL RESULTS ==="
          tail -n +2 output.csv | wc -l
          echo "clinics scraped"
          echo "With email:"
          python3 -c "
          import csv
          rows = list(csv.DictReader(open('output.csv')))
          print(sum(1 for r in rows if r.get('emails','').strip()), 'clinics with email')
          print(sum(1 for r in rows if r.get('phone','').strip()), 'clinics with phone')
          "

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: caucasus-dental-leads-run${{ github.run_number }}
          path: output.csv
          retention-days: 30
