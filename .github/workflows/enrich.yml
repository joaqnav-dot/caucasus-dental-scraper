name: Enrich Dental Leads

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID from scraper workflow (leave empty to use latest)'
        required: false
        default: ''

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest scraper output
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            RUN_ID="${{ github.event.inputs.run_id }}"
          else
            RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=scrape.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Using scraper run ID: $RUN_ID"
          gh run download $RUN_ID --repo ${{ github.repository }} --pattern "caucasus-dental-leads-*" --dir ./downloaded
          cp ./downloaded/*/output.csv ./output.csv
          echo "Loaded $(wc -l < output.csv) rows"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 duckduckgo-search

      - name: Run enrichment
        env:
          INPUT_FILE: output.csv
          OUTPUT_FILE: enriched.csv
        run: python enrich.py

      - name: Upload enriched CSV
        uses: actions/upload-artifact@v4
        with:
          name: caucasus-dental-enriched-run${{ github.run_number }}
          path: enriched.csv
          retention-days: 30
