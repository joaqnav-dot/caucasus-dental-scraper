name: Enrich Dental Leads

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID from scraper workflow'
        required: true
      city_name:
        description: 'City name for artifact naming (e.g. ankara, izmir)'
        required: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Download scraper output
        run: |
          gh run download ${{ github.event.inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir ./downloaded
          find ./downloaded -name "*.csv" | head -1 | xargs -I{} cp {} ./input.csv
          echo "Rows: $(wc -l < input.csv)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - run: pip install requests beautifulsoup4 duckduckgo-search

      - name: Run enrichment
        env:
          INPUT_FILE: input.csv
          OUTPUT_FILE: enriched.csv
        run: python enrich.py

      - uses: actions/upload-artifact@v4
        with:
          name: enriched-${{ github.event.inputs.city_name }}-run${{ github.run_number }}
          path: enriched.csv
          retention-days: 60
